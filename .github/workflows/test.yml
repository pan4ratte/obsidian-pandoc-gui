name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # The version the fixtures under `tests/markdowns` were written by: they are
      # pandoc's own native output, so the reader that produced them is part of
      # what is being tested. Bump it when developing against a newer pandoc.
      - name: Install Pandoc
        env:
          PANDOC_VERSION: 3.10.2
        run: |
          wget --tries=5 --waitretry=10 --retry-connrefused --retry-on-http-error=429,500,502,503,504 \
            "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-1-amd64.deb"
          sudo dpkg -i "pandoc-$PANDOC_VERSION-1-amd64.deb"
      - name: Install Dependencies
        run: npm ci
      - name: Catalogue is generated, not hand-edited
        run: npm run docs:catalogue:check
      - name: Reference documents are generated, not hand-edited
        run: npm run gen:references:check
      - name: Test
        run: npm test
